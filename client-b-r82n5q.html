<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Gallery</title>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: 'Manrope', sans-serif;
      background: linear-gradient(-45deg, #ffffff, #f4efe9, #7B024D, #ff8ac6);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      color: white;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .top-brand {
      text-align: center;
      padding: 60px 20px 30px;
    }

    .logo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 2px solid rgba(255,255,255,0.7);
      padding: 4px;
      background: rgba(255,255,255,0.15);
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin: 0;
    }

    .gallery-box {
      background: white;
      color: #111;
      border-radius: 20px;
      padding: 30px;
      margin: 0 auto 60px;
      width: 90%;
      max-width: 1100px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .gallery-heading {
      text-align: center;
      margin-bottom: 10px;
    }

    .gallery-subtext {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .action-buttons {
      text-align: center;
      margin-bottom: 25px;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="top-brand">
    <img src="logo.png" class="logo">
    <h1 class="brand-title">JustMaybeMi</h1>
  </div>

  <div class="gallery-box">

    <h2 class="gallery-heading">Client Gallery</h2>
    <p class="gallery-subtext">Click to view photos. Download selected images.</p>

    <div class="action-buttons">
      <button class="btn" id="downloadSelectedBtn">Download Selected</button>
    </div>

    <section class="gallery-grid" id="galleryGrid"></section>

  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <button id="closeLightbox">Close</button>
      <button id="prevBtn">&#10094;</button>
      <img id="lightboxImage">
      <button id="nextBtn">&#10095;</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    setupClientGallery({
      images: [
        "assets/images/client-b/1.png",
        "assets/images/client-b/2.png",
        "assets/images/client-b/3.png",
        "assets/images/client-b/4.png"
      ]
    });
  </script>

</body>
</html>
