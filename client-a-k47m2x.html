<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="top-section">
      <h1 class="gallery-heading">Client Gallery</h1>
      <p class="gallery-subtext">Click to view photos. Download selected images.</p>

      <div class="action-buttons">
        <button class="btn" id="downloadSelectedBtn" type="button">
          Download Selected
        </button>
      </div>
    </section>

    <section class="gallery-grid" id="galleryGrid"></section>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <button class="lightbox-close" id="closeLightbox" type="button">Close</button>
      <button class="lightbox-arrow left" id="prevBtn" type="button">&#10094;</button>
      <img id="lightboxImage" class="lightbox-image" src="" alt="Full size photo">
      <button class="lightbox-arrow right" id="nextBtn" type="button">&#10095;</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    setupClientGallery({
      images: [
        "assets/images/client-a/1.png",
        "assets/images/client-a/2.png",
        "assets/images/client-a/3.png",
        "assets/images/client-a/4.png"
      ]
    });
  </script>
</body>
</html>
