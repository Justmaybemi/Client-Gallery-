<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jane Client Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="top-section">
      <img src="logo.png" alt="Logo" class="logo">
      <div class="brand-name">Funmi Photography</div>

      <h1 class="gallery-heading">Jane Client Gallery</h1>
      <p class="gallery-subtext">
        Click to view photos. Select images to download, or download the full gallery.
      </p>

      <div class="action-buttons">
        <a
          class="btn btn-primary"
          href="assets/images/client-jane/client-jane-gallery.zip"
          download
        >
          Download All
        </a>

        <button class="btn" id="downloadSelectedBtn" type="button">
          Download Selected
        </button>
      </div>
    </section>

    <section class="gallery-grid" id="galleryGrid"></section>

    <p class="footer-note">Funmi Photography</p>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <button class="lightbox-close" id="closeLightbox" type="button">Close</button>
      <button class="lightbox-arrow left" id="prevBtn" type="button">&#10094;</button>
      <img id="lightboxImage" class="lightbox-image" src="" alt="Full size photo">
      <button class="lightbox-arrow right" id="nextBtn" type="button">&#10095;</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    setupClientGallery({
      images: [
        "assets/images/client-jane/1.jpg",
        "assets/images/client-jane/2.jpg",
        "assets/images/client-jane/3.jpg",
        "assets/images/client-jane/4.jpg"
      ]
    });
  </script>
</body>
</html>
