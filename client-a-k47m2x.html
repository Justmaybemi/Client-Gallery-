<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BILLBOARD FACE FASHION SHOW OCTOBER 25TH 2026 | JustMaybeMi</title>

  <!-- SPEED FIX: connect to Firebase servers early -->
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: 'Manrope', sans-serif;
      background: linear-gradient(-45deg, #ffffff, #f4efe9, #7B024D, #ff8ac6);
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
      color: white;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hero {
      position: relative;
      min-height: 72vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.34), rgba(0, 0, 0, 0.62)),
        linear-gradient(to right, rgba(0, 0, 0, 0.34), rgba(0, 0, 0, 0.12));
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: min(92%, 1180px);
      padding: 34px 0 64px;
      text-align: center;
    }

    .brand-link {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.76);
      padding: 4px;
      background: rgba(255,255,255,0.14);
      box-shadow: 0 12px 30px rgba(0,0,0,0.22);
    }

    .brand-name {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 6vw, 5rem);
      line-height: 1;
    }

    .session-label {
      margin: 8px 0 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.86);
    }

    .session-title {
      margin: 0 0 14px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.1rem, 5vw, 4rem);
      line-height: 1.04;
    }

    .hero-text {
      max-width: 720px;
      margin: 0 auto 28px;
      color: rgba(255,255,255,0.9);
      line-height: 1.75;
      font-size: 1rem;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .hero-btn, .btn {
      border: none;
      border-radius: 999px;
      padding: 13px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .hero-btn:hover, .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.14);
    }

    .hero-btn.primary, .btn.primary {
      background: white;
      color: #111;
    }

    .hero-btn.secondary, .btn.secondary {
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.42);
      backdrop-filter: blur(6px);
    }

    .gallery-section {
      width: min(92%, 1180px);
      margin: -42px auto 80px;
      position: relative;
      z-index: 3;
    }

    .gallery-shell {
      background: rgba(255,255,255,0.98);
      color: #111;
      border-radius: 28px;
      padding: 24px 22px 28px;
      box-shadow:
        0 40px 90px rgba(37, 9, 28, 0.22),
        0 18px 40px rgba(0,0,0,0.14),
        0 0 0 1px rgba(255,255,255,0.24) inset;
      backdrop-filter: blur(6px);
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 22px;
    }
</body>
</html>
