<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Gallery</title>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Manrope', sans-serif;
      background: linear-gradient(-45deg, #ffffff, #f4efe9, #7B024D, #ff8ac6);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      color: white;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .top-brand {
      text-align: center;
      padding: 60px 20px 30px;
    }

    .logo {
      width: 65px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin: 0;
    }

    .gallery-box {
      background: white;
      color: black;
      border-radius: 20px;
      padding: 30px;
      margin: auto;
      width: 90%;
      max-width: 1000px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .gallery-grid img {
      width: 100%;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<div class="top-brand">
  <img src="logo.png" class="logo">
  <h1 class="brand-title">JustMaybeMi</h1>
</div>

<div class="gallery-box">
  <h2>Client Gallery</h2>
  <div class="gallery-grid" id="gallery"></div>
</div>

<!-- 🔥 FIREBASE CODE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhajOJDE7aLZ-VPJq1wtCTZCZPrs-FDes",
  authDomain: "justmaybemi.firebaseapp.com",
  projectId: "justmaybemi",
  storageBucket: "justmaybemi.firebasestorage.app",
  messagingSenderId: "1025934443334",
  appId: "1:1025934443334:web:90c86cd5eccca8c70c1b47"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔐 SIGN IN (REQUIRED FOR PRIVATE ACCESS)
await signInAnonymously(auth);

const storage = getStorage(app);
const gallery = document.getElementById("gallery");

const images = [
  "galleries/client-a/1.png",
  "galleries/client-a/2.png",
  "galleries/client-a/3.png",
  "galleries/client-a/4.png"
];

// Load images from Firebase
for (const path of images) {
  try {
    const url = await getDownloadURL(ref(storage, path));
    const img = document.createElement("img");
    img.src = url;
    gallery.appendChild(img);
  } catch (e) {
    console.error("Error loading:", path, e);
  }
}
</script>

</body>
</html>
