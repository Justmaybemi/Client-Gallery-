<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustMaybeMi</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(-45deg, #ffffff, #f4efe9, #7B024D, #ff8ac6);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      color: white;
      text-align: center;
      padding: 24px;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .box {
      max-width: 420px;
      width: 100%;
    }
    img {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 14px;
      border: 2px solid rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.12);
      padding: 4px;
    }
    h1 { margin: 0 0 10px; font-size: 3rem; }
    p { margin: 0 0 20px; }
    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      margin-top: 10px;
      font-size: 1rem;
    }
    input {
      border-radius: 12px;
    }
    button {
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="logo.png" alt="Logo">
    <h1>JustMaybeMi</h1>
    <p>Enter your gallery access code</p>
    <input id="codeInput" type="text" placeholder="CLIENTA or CLIENTB">
    <button onclick="openGallery()">Open Gallery</button>
  </div>

  <script>
    function openGallery() {
      const code = document.getElementById("codeInput").value.trim().toUpperCase();

      if (code === "CLIENTA") {
        window.location.href = "client-a-k47m2x.html";
      } else if (code === "CLIENTB") {
        window.location.href = "client-b-r82n5q.html";
      } else {
        alert("Invalid code");
      }
    }
  </script>
</body>
</html>
</html>
