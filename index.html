<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustMaybeMi</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Manrope', sans-serif;
      background: linear-gradient(-45deg, #ffffff, #f4efe9, #7B024D, #ff8ac6);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      color: white;
      text-align: center;
      padding: 20px 16px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .box {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 16px;
      border: 2px solid rgba(255,255,255,0.7);
      padding: 4px;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.4rem, 9vw, 3.2rem);
      line-height: 1;
      font-family: 'Playfair Display', serif;
    }

    p {
      margin: 0 0 20px;
      max-width: 320px;
      line-height: 1.5;
      opacity: 0.95;
    }

    .form-wrap {
      width: 100%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 18px;
      padding: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.14);
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      margin-bottom: 10px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    button:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .error {
      display: none;
      margin-top: 12px;
      font-size: 0.92rem;
      color: #ffe5e5;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 14px;
      }

      .form-wrap {
        padding: 10px;
        border-radius: 16px;
      }

      p {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="logo.png" alt="JustMaybeMi logo" class="logo">
    <h1>JustMaybeMi</h1>
    <p>Enter your access code to view your gallery</p>

    <div class="form-wrap">
      <input
        id="codeInput"
        type="text"
        placeholder="Enter access code"
        autocomplete="off"
        spellcheck="false"
      >
      <button id="openGalleryBtn" type="button">View Gallery</button>
    </div>

    <div id="errorMessage" class="error"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-functions.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhajOJDE7aLZ-VPJq1wtCTZCZPrs-FDes",
      authDomain: "justmaybemi.firebaseapp.com",
      projectId: "justmaybemi",
      storageBucket: "justmaybemi.firebasestorage.app",
      messagingSenderId: "1025934443334",
      appId: "1:1025934443334:web:90c86cd5eccca8c70c1b47"
    };

    const app = initializeApp(firebaseConfig);
    const functions = getFunctions(app, "northamerica-northeast2");
    const unlockGallery = httpsCallable(functions, "unlockGallery");

    const input = document.getElementById("codeInput");
    const button = document.getElementById("openGalleryBtn");
    const errorMessage = document.getElementById("errorMessage");

    async function openGallery() {
      const code = input.value.trim().toUpperCase();

      errorMessage.style.display = "none";
      errorMessage.textContent = "";

      if (!code) {
        errorMessage.textContent = "Please enter an access code.";
        errorMessage.style.display = "block";
        return;
      }

      button.disabled = true;
      button.textContent = "Opening...";

      try {
        const result = await unlockGallery({ code });
        sessionStorage.setItem("galleryData", JSON.stringify(result.data));
        window.location.href = "gallery.html";
      } catch (error) {
        console.error(error);
        errorMessage.textContent = "Invalid or expired access code.";
        errorMessage.style.display = "block";
      } finally {
        button.disabled = false;
        button.textContent = "View Gallery";
      }
    }

    button.addEventListener("click", openGallery);

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        openGallery();
      }
    });
  </script>
</body>
</html>
