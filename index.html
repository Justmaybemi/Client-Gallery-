<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustMaybeMi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(-45deg, #ffffff, #f4efe9, #7B024D, #ff8ac6);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      color: white;
      text-align: center;
      padding: 20px 16px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .box {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 16px;
      border: 2px solid rgba(255,255,255,0.7);
      padding: 4px;
      background: rgba(255,255,255,0.12);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.4rem, 9vw, 3.2rem);
      line-height: 1;
    }

    p {
      margin: 0 0 20px;
      max-width: 320px;
      line-height: 1.5;
      opacity: 0.95;
    }

    .form-wrap {
      width: 100%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 18px;
      padding: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.14);
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      margin-bottom: 10px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 14px;
      }

      .box {
        max-width: 100%;
      }

      .form-wrap {
        padding: 10px;
        border-radius: 16px;
      }

      p {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="logo.png" alt="Logo">

    <h1>JustMaybeMi</h1>

    <p>Enter your access code to view your gallery</p>

    <div class="form-wrap">
      <input 
        id="codeInput" 
        type="text" 
        placeholder="Enter access code"
        autocomplete="off"
      >

      <button onclick="openGallery()">View Gallery</button>
    </div>
  </div>
  
<script>
  function openGallery() {
    const code = document.getElementById("codeInput").value.trim().toUpperCase();

    if (code === "CLIENTA") {
      window.location.href = "client-a-k47m2x.html";
    } else if (code === "CLIENTB") {
      window.location.href = "client-b-r82n5q.html";
    } else if (code === "COLC") {
      window.location.href = "client-c.html";
    } else {
      alert("Invalid access code");
    }
  }

  document.getElementById("codeInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      openGallery();
    }
  });
</script>
