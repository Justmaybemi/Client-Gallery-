<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Upload</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    input, button { display: block; width: 100%; padding: 12px; margin: 8px 0; font-size: 1rem; }
    button { cursor: pointer; }
    #status { white-space: pre-wrap; color: #333; }
  </style>
</head>
<body>
  <h2>Upload photos</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="login">Log in</button>

  <hr>

  <input id="gallery" placeholder="Gallery name e.g. client-a">
  <input id="files" type="file" multiple accept="image/*">
  <button id="upload">Upload</button>
  <p id="status"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

    const app = initializeApp({
      apiKey: "AIzaSyAhajOJDE7aLZ-VPJq1wtCTZCZPrs-FDes",
      authDomain: "justmaybemi.firebaseapp.com",
      projectId: "justmaybemi",
      storageBucket: "justmaybemi.firebasestorage.app",
      messagingSenderId: "1025934443334",
      appId: "1:1025934443334:web:90c86cd5eccca8c70c1b47"
    });
    const auth = getAuth(app);
    const storage = getStorage(app);
    const status = document.getElementById("status");

    const SIZES = { thumb: [400, 0.8], md: [1200, 0.82], full: [2400, 0.88] };

    async function resize(file, maxWidth, quality) {
      const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
      const scale = Math.min(1, maxWidth / bmp.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bmp.width * scale);
      canvas.height = Math.round(bmp.height * scale);
      canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
      return new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
    }

    async function uploadPhoto(file, gallery) {
      const name = file.name.replace(/\.[^.]+$/, "").replace(/[^a-z0-9_-]/gi, "-") + ".jpg";
      for (const [size, [width, quality]] of Object.entries(SIZES)) {
        const blob = await resize(file, width, quality);
        await uploadBytes(ref(storage, `galleries/${gallery}/${size}/${name}`), blob, {
          contentType: "image/jpeg",
          cacheControl: "public,max-age=31536000"
        });
      }
    }

    document.getElementById("login").onclick = () =>
      signInWithEmailAndPassword(auth, email.value, password.value)
        .then(() => status.textContent = "Logged in")
        .catch(e => status.textContent = e.message);

    document.getElementById("upload").onclick = async () => {
      const files = document.getElementById("files").files;
      const gallery = document.getElementById("gallery").value.trim();
      if (!gallery || !files.length) { status.textContent = "Enter a gallery name and pick photos."; return; }
      let n = 0;
      try {
        for (const f of files) {
          await uploadPhoto(f, gallery);
          status.textContent = `Uploaded ${++n} / ${files.length}`;
        }
        status.textContent += "\nDone!";
      } catch (e) {
        status.textContent = "Error: " + e.message;
      }
    };
  </script>
</body>
</html>
