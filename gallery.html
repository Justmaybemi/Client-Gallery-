<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    img {
      width: 100%;
      border-radius: 12px;
      display: block;
      background: #ddd;
    }
    pre {
      background: white;
      padding: 12px;
      border-radius: 10px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1 id="title">Gallery Test</h1>
  <pre id="debug"></pre>
  <div class="grid" id="gallery"></div>

  <script>
    const raw = sessionStorage.getItem("galleryData");
    const debug = document.getElementById("debug");
    const title = document.getElementById("title");
    const gallery = document.getElementById("gallery");

    if (!raw) {
      debug.textContent = "No galleryData found in sessionStorage";
    } else {
      const data = JSON.parse(raw);
      debug.textContent = JSON.stringify(data, null, 2);

      title.textContent = data.sessionTitle || "Gallery Test";

      if (data.images && data.images.length) {
        data.images.forEach((url) => {
          const img = document.createElement("img");
          img.src = url;
          img.alt = "Gallery image";
          gallery.appendChild(img);
        });
      } else {
        debug.textContent += "\n\nNo images found in returned data.";
      }
    }
  </script>
</body>
</html>
